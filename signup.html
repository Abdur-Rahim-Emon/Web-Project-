<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Shohoz</title>
 <link rel="stylesheet" href="signup.css">
  <script src="theme.js"></script>

</head>
<body>
   <h1 id="title">Bus Transport Automation</h1>
   <div class="wrapper">
  <div class="container">
    <img src="busLogo.png" alt="Bus logo" class="logo">
    
    <h2>Create an account</h2>
    <p>Create your account once and enjoy a seamless journey across all Bus Transport Automation.<br>
    One account for all your travel needs.</p>

      <!-- sign up form code start from here -->


    <form id="signupForm" class="form active">
    <!-- take details for name -->
      <div class="form-row">
        <div class="col">
          <label>First Name </label>
          <input type="text" id="firstName" placeholder="Enter first name" required>
        </div>

        <div class="col">
          <label>Last Name </label>
          <input type="text" id="lastName" placeholder="Enter last name" required>
        </div>
      </div>

 <!-- take details for email and phone number -->
      <div class="form-row">
        <div class="col">
          <label>Mobile Number </label>
          <input type="text" id="mobile" placeholder="Enter mobile number" required>
        </div>
        <div class="col">
          <label>Email </label>
          <input type="email" id="email" placeholder="Enter email" required>
        </div>
      </div>
         
  <!-- label for gender  -->

      <label>Gender </label>
      <div class="gender-box">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
      </div>

      <!-- password code -->
      <label>Password </label>
      <input type="password" id="password" placeholder="Enter password" required>

      <label>Confirm Password </label>
      <input type="password" id="confirmPassword" placeholder="Confirm password" required>

      <button type="button" class="login-btn" onclick="signupUser()">Sign Up</button>

      <p class="back-login">Already have an account? <a href="index.html">Back to Login</a></p>
    </form>
  </div>
</div>

<script src="footer.js"></script>
<script src="signup.js?v=20251228"></script>

</body>
</html>
